services:

  postgres:
    image: postgres:17
    container_name: vault-postgres

    environment:
      POSTGRES_DB: vault
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password

    ports:
      - "5433:5432"

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d vault
      interval: 5s
      timeout: 5s
      retries: 5

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8
    container_name: vault-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: vault-qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"

  api:
    build: .
    container_name: vault-api
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:password@postgres:5432/vault
      REDIS_URL: redis://redis:6379/0

      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30

      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333

      OLLAMA_HOST: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma2:2b}

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  celery:
    build: .
    container_name: vault-celery
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:password@postgres:5432/vault
      REDIS_URL: redis://redis:6379/0

      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30

      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333

      OLLAMA_HOST: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma2:2b}

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started

    command: >
      celery -A app.core.celery_app.celery_app worker --loglevel=info


volumes:
  postgres_data:
  redis_data:
  qdrant_data: